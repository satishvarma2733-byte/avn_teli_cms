version: 2

# Updates arrive as pull requests, so CI (and the security workflow) runs on each before it is merged.
updates:
  - package-ecosystem: npm
    directory: /avn_cms
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor releases together: one pull request a week, not thirty.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Playwright is pinned to the version that matches the installed Chromium (docs/BUILD_STATUS.md).
      - dependency-name: "@playwright/test"
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /avn_cms
    schedule:
      interval: weekly
