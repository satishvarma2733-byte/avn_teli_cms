name: Security

# Known-vulnerable dependencies, secrets in the code or its history, and static analysis.
# Runs on every push and pull request, and weekly (new advisories appear without any code change).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: avn_cms
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: avn_cms/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: avn_cms/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fails on anything moderate or worse, in the code we ship and in the tools we build with.
      - name: Audit
        run: pnpm audit --audit-level moderate

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still a leaked secret
      - name: Scan the working tree and every commit
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
