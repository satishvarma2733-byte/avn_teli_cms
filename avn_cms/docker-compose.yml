# Local development services for aVn CMS. Not for production.
# Usage: pnpm stack:up / pnpm stack:down. Credentials are local-only and must match .env.
name: avn-cms-dev

services:
  postgres:
    image: postgres:18-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: avn_owner
      POSTGRES_PASSWORD: avn_owner_local_only
      POSTGRES_DB: avn_cms
    ports:
      - '127.0.0.1:55450:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the non-owner application role (RLS enforced) and the test database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avn_owner -d avn_cms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:16390:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:51125:1025' # SMTP
      - '127.0.0.1:58125:8025' # web UI

  # S3-compatible object storage standing in for Cloudflare R2 (documents vault). Production uses R2.
  # Docker Hub no longer serves new minio/minio pulls; if this image is missing on your machine,
  # point R2_ENDPOINT at any other S3-compatible server instead (docs/DOCUMENTS.md).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: avn_minio
      MINIO_ROOT_PASSWORD: avn_minio_local_only
      # Browsers upload straight to the bucket with presigned URLs, so the app origins must be allowed.
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3300,http://localhost:3301'
    ports:
      - '127.0.0.1:19000:9000' # S3 API
      - '127.0.0.1:19001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Antivirus for uploaded documents (clamd). The first start downloads the signature database
  # (a few minutes); files stay unavailable until a scan says they are clean.
  clamav:
    image: clamav/clamav:stable
    ports:
      - '127.0.0.1:33100:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
