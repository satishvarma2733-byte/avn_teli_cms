# Local development services for aVn CMS. Not for production.
# Usage: pnpm stack:up / pnpm stack:down. Credentials are local-only and must match .env.
name: avn-cms-dev

services:
  postgres:
    image: postgres:17-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: avn_owner
      POSTGRES_PASSWORD: avn_owner_local_only
      POSTGRES_DB: avn_cms
    ports:
      - '127.0.0.1:55450:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the non-owner application role (RLS enforced) and the test database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avn_owner -d avn_cms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:16390:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:51125:1025' # SMTP
      - '127.0.0.1:58125:8025' # web UI

volumes:
  postgres-data:
  redis-data:
